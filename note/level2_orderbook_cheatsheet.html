<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Open-source Pine Script indicators and an interactive order book learning lab."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Order Book Lab — Terminal</title>
    <script>
      try {
        var t = localStorage.getItem("signal-theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        if (matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Enable JavaScript to use Terminal. Indicator source files are available
      in the repository.</noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
